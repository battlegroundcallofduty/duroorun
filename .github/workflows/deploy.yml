name: Deploy

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check app/

  deploy:
    needs: lint
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          cd ~/duroorun

          git fetch origin main
          git reset --hard origin/main

          cd frontend
          npm ci
          npm run build
          rsync -a --delete dist/ /var/www/duroorun/
          cd ..

          docker compose up -d --build

# 개인정보처리방침 3번(애플리케이션 로그 보관)과 일치시키기 위해 모든 서비스에
# 동일한 로그 크기 제한을 적용 - 컨테이너당 최대 10MB x 5개 파일(50MB)까지만
# 보관되고, 초과분은 가장 오래된 파일부터 docker가 자동으로 삭제한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL 16 (데이터베이스)
  db:
    image: postgres:16
    container_name: duroorun-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: duroorun
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Redis (캐싱 / Refresh Token / 블랙리스트 / OAuth state)
  redis:
    image: redis:7
    container_name: duroorun-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # FastAPI 백엔드
  backend:
    build: .
    container_name: duroorun-backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 컨테이너 안에서는 localhost가 아니라 서비스명(db, redis)으로 접속해야 함
    # .env의 DATABASE_URL / REDIS_URL을 아래로 덮어씀
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/duroorun
      REDIS_URL: redis://redis:6379/0
    # 서버 시작 전 마이그레이션 자동 적용 후 uvicorn 실행
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
